# D-PlaneOS CI/CD Phase 3 Additions
# These jobs should be inserted into .github/workflows/ci.yml
# Insert before the "release:" job (around line 578)

# ════════════════════════════════════════════════════════════════════════════
# STAGE 5C: LIVE BOOT ISO BUILD - Live boot environment (no installation needed)
# Builds live boot ISO for both x86_64 and aarch64 in parallel.
# ════════════════════════════════════════════════════════════════════════════
build-live-iso:
  name: Build Live Boot ISO
  needs: [validate, integration, ha-failover-logic, ha-promotion-zfs, ha-vm-cluster]
  if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/live-boot'
  runs-on: ubuntu-22.04
  strategy:
    matrix:
      include:
        - system: "x86_64-linux"
          runner: "ubuntu-22.04"
          iso_target: "iso-live"
          output_name: "dplaneos-*-live-x86_64.iso"
          artifact_name: "iso-live-x86_64"
        - system: "aarch64-linux"
          runner: "ubuntu-22.04-arm"
          iso_target: "iso-live-arm"
          output_name: "dplaneos-*-live-arm64.iso"
          artifact_name: "iso-live-arm64"
  runs-on: ${{ matrix.runner }}
  permissions:
    contents: write

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download pinned flake.lock from ha-vm-cluster
      uses: actions/download-artifact@v4
      with:
        name: flake-lock
        path: /tmp/flake-lock-artifact

    - name: Install flake.lock in repo root
      run: |
        if [ -f /tmp/flake-lock-artifact/flake.lock ]; then
          cp /tmp/flake-lock-artifact/flake.lock flake.lock
          echo "flake.lock installed ($(wc -c < flake.lock) bytes)"
        else
          echo "WARNING: artifact did not contain flake.lock at expected path"
          ls -la /tmp/flake-lock-artifact/ || true
        fi

    - name: Free disk space
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Reclaim disk space for Nix store
      uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7  # main

    - name: Install Nix
      uses: cachix/install-nix-action@v30
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true
          extra-substituters = https://cache.nixos.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

    - name: Report available disk space
      run: df -h /

    - name: Verify VERSION matches tag (Tags only)
      id: version
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "ERROR: VERSION file ($FILE_VERSION) does not match tag ($VERSION)"
            exit 1
          fi
        else
          VERSION="$(cat VERSION | tr -d '[:space:]')"
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Build live boot ISO (${{ matrix.system }})
      run: |
        echo "Building ${{ matrix.iso_target }} for ${{ matrix.system }}..."
        nix build ".#${{ matrix.iso_target }}" --print-build-logs
        ls -lh result/iso/

    - name: Package ISO and generate closure SBOM (${{ matrix.system }})
      id: package
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        ISO_NAME="dplaneos-v${VERSION}-live-${{ matrix.system == 'x86_64-linux' && 'x86_64' || 'arm64' }}.iso"
        cp result/iso/*.iso "$ISO_NAME"
        sha256sum "$ISO_NAME" > "${ISO_NAME}.sha256"
        echo "iso_name=${ISO_NAME}" >> $GITHUB_OUTPUT
        echo "iso_sha=${ISO_NAME}.sha256" >> $GITHUB_OUTPUT

        # Generate SBOM from the Nix closure (same process as installer ISO)
        SYSTEM_PATH=$(nix eval --raw ".#nixosConfigurations.dplaneos-live${{ matrix.system == 'aarch64-linux' && '-arm' || '' }}.config.system.build.toplevel" 2>&1)
        echo "System toplevel: $SYSTEM_PATH"
        if [[ "$SYSTEM_PATH" != /nix/store/* ]]; then
          echo "ERROR: could not resolve dplaneos-live toplevel: $SYSTEM_PATH"; exit 1
        fi
        nix path-info -r "$SYSTEM_PATH" --json | python3 .github/scripts/generate-iso-sbom.py "$ISO_NAME" > "${ISO_NAME}.sbom.json"
        echo "SBOM: $(python3 -c "import json; d=json.load(open('${ISO_NAME}.sbom.json')); print(len(d['packages']),'packages')" 2>/dev/null)"
        echo "iso_sbom=${ISO_NAME}.sbom.json" >> $GITHUB_OUTPUT

    - name: Upload Live ISO artifact for signing in release job
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          ${{ steps.package.outputs.iso_name }}
          ${{ steps.package.outputs.iso_sha }}
          ${{ steps.package.outputs.iso_sbom }}

# ════════════════════════════════════════════════════════════════════════════
# STAGE 5D: TEST LIVE BOOT - VM-based integration test for live boot functionality
# Validates that system boots, daemon starts, UI accessible, ZFS auto-imports, etc.
# ════════════════════════════════════════════════════════════════════════════
test-live-boot:
  name: Test Live Boot (VM)
  needs: [prepare]
  if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/live-boot'
  runs-on: ubuntu-22.04
  permissions:
    contents: write

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v30
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true
          extra-substituters = https://cache.nixos.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

    - name: Run live boot VM test (x86_64)
      timeout-minutes: 5
      run: |
        echo "Running D-PlaneOS live boot VM test..."
        nix build .#checks.x86_64-linux.live-boot -L 2>&1 | tee /tmp/test-live-boot.log

    - name: Verify test passed
      run: |
        if grep -q "✓ ALL TESTS PASSED" /tmp/test-live-boot.log; then
          echo "✓ Live boot test passed"
        else
          echo "✗ Live boot test failed"
          tail -100 /tmp/test-live-boot.log
          exit 1
        fi

